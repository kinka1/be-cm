name: Deploy Laravel Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-laravel-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Create deployment archive
        run: |
          set -euo pipefail

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='node_modules' \
            --exclude='tests' \
            -czf "$RUNNER_TEMP/backend.tar.gz" .

          test -s "$RUNNER_TEMP/backend.tar.gz"
          ls -lh "$RUNNER_TEMP/backend.tar.gz"

      - name: Prepare and test SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: VPS_SSH_KEY kosong."
            exit 1
          fi

          if [ -z "$VPS_HOST" ]; then
            echo "ERROR: VPS_HOST kosong."
            exit 1
          fi

          if [ -z "$VPS_USER" ]; then
            echo "ERROR: VPS_USER kosong."
            exit 1
          fi

          if [ -z "$VPS_PORT" ]; then
            echo "ERROR: VPS_PORT kosong."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          # Memastikan private key valid.
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan \
            -T 15 \
            -p "$VPS_PORT" \
            -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "echo 'Koneksi SSH berhasil.'"

      - name: Upload deployment archive
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/deploy_key \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/backend.tar.gz" \
            "$VPS_USER@$VPS_HOST:/home/deploy/releases/backend/backend.tar.gz"

      - name: Activate atomic deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE_ID: ${{ github.run_number }}-${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s" << 'EOF'
              set -euo pipefail

              BASE_DIR="/var/www/calon-mantoe.cloud/backend"
              RELEASES_DIR="$BASE_DIR/releases"
              SHARED_DIR="$BASE_DIR/shared"
              CURRENT_LINK="$BASE_DIR/current"

              ARCHIVE="/home/deploy/releases/backend/backend.tar.gz"

              # Ambil bagian awal commit SHA agar nama folder tidak terlalu panjang.
              RELEASE_SHORT="$(echo "$RELEASE_ID" | cut -c1-24)"
              RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHORT"

              echo "1. Memeriksa file deployment"
              test -s "$ARCHIVE"

              echo "2. Memeriksa file .env production"
              if [ ! -f "$SHARED_DIR/.env" ]; then
                echo "ERROR: $SHARED_DIR/.env tidak ditemukan."
                exit 1
              fi

              echo "3. Membuat folder release baru"
              mkdir -p "$RELEASES_DIR"
              rm -rf "$RELEASE_DIR"
              mkdir -p "$RELEASE_DIR"

              echo "4. Mengekstrak aplikasi"
              tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

              cd "$RELEASE_DIR"

              echo "5. Menghubungkan .env production"
              rm -f .env
              ln -s "$SHARED_DIR/.env" .env

              echo "6. Menghubungkan shared storage"

              SHARED_STORAGE="$SHARED_DIR/storage"

              mkdir -p "$SHARED_STORAGE/app/public"
              mkdir -p "$SHARED_STORAGE/framework/cache/data"
              mkdir -p "$SHARED_STORAGE/framework/sessions"
              mkdir -p "$SHARED_STORAGE/framework/testing"
              mkdir -p "$SHARED_STORAGE/framework/views"
              mkdir -p "$SHARED_STORAGE/logs"
              mkdir -p bootstrap/cache

              rm -rf storage
              ln -s "$SHARED_STORAGE" storage

              echo "7. Mengatur permission Laravel"

              chgrp -R www-data "$SHARED_STORAGE" bootstrap/cache

              find "$SHARED_STORAGE" bootstrap/cache \
                -type d \
                -exec chmod 2775 {} \;

              find "$SHARED_STORAGE" bootstrap/cache \
                -type f \
                -exec chmod 664 {} \;

              echo "8. Membersihkan cache Laravel"
              php artisan optimize:clear

              echo "9. Membuat storage link"
              rm -rf public/storage
              php artisan storage:link

              echo "10. Menjalankan migration"
              php artisan migrate --force

              echo "11. Membuat cache production"
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache

              echo "12. Memastikan Laravel dapat dijalankan"
              php artisan about > /dev/null

              echo "13. Menyimpan release sebelumnya untuk rollback"
              PREVIOUS_RELEASE=""

              if [ -L "$CURRENT_LINK" ]; then
                PREVIOUS_RELEASE="$(readlink -f "$CURRENT_LINK")"
              fi

              echo "14. Mengaktifkan release baru secara atomik"

              NEXT_LINK="$BASE_DIR/current-next"

              rm -f "$NEXT_LINK"
              ln -s "$RELEASE_DIR" "$NEXT_LINK"
              mv -Tf "$NEXT_LINK" "$CURRENT_LINK"

              echo "15. Menghidupkan aplikasi"
              php artisan up || true

              echo "16. Membersihkan archive"
              rm -f "$ARCHIVE"

              echo "17. Menyimpan maksimal 5 release terakhir"

              mapfile -t OLD_RELEASES < <(
                find "$RELEASES_DIR" \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d \
                  -printf '%T@ %p\n' \
                  | sort -nr \
                  | tail -n +6 \
                  | cut -d' ' -f2-
              )

              for OLD_RELEASE in "${OLD_RELEASES[@]}"; do
                # Jangan hapus release yang masih aktif.
                if [ "$OLD_RELEASE" != "$(readlink -f "$CURRENT_LINK")" ]; then
                  rm -rf "$OLD_RELEASE"
                fi
              done

              echo "Deployment Laravel berhasil."
              echo "Current release: $(readlink -f "$CURRENT_LINK")"
          EOF