name: Deploy Laravel Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-laravel-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Create deployment archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            -czf "$RUNNER_TEMP/backend.tar.gz" .

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload backend archive
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P "$VPS_PORT" \
            "$RUNNER_TEMP/backend.tar.gz" \
            "$VPS_USER@$VPS_HOST:/home/deploy/releases/backend/backend.tar.gz"

      - name: Activate Laravel deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'
              set -e

              ARCHIVE="/home/deploy/releases/backend/backend.tar.gz"
              TEMP_DIR="/home/deploy/releases/backend/current"
              APP_DIR="/var/www/calon-mantoe.cloud/backend"

              echo "1. Menyiapkan folder sementara"

              rm -rf "$TEMP_DIR"
              mkdir -p "$TEMP_DIR"

              echo "2. Mengekstrak source code"

              tar -xzf "$ARCHIVE" -C "$TEMP_DIR"

              echo "3. Memastikan file .env production tersedia"

              if [ ! -f "$APP_DIR/.env" ]; then
                echo "ERROR: File $APP_DIR/.env tidak ditemukan"
                exit 1
              fi

              cp "$APP_DIR/.env" "$TEMP_DIR/.env"

              echo "4. Mengaktifkan maintenance mode jika aplikasi lama tersedia"

              if [ -f "$APP_DIR/artisan" ]; then
                cd "$APP_DIR"
                php artisan down || true
              fi

              echo "5. Menghapus source code lama tanpa menghapus .env dan storage"

              find "$APP_DIR" \
                -mindepth 1 \
                -maxdepth 1 \
                ! -name ".env" \
                ! -name "storage" \
                -exec rm -rf {} +

              echo "6. Memindahkan source code baru"

              cp -a "$TEMP_DIR"/. "$APP_DIR"/

              cd "$APP_DIR"

              echo "7. Menyiapkan folder Laravel"

              mkdir -p storage/framework/cache
              mkdir -p storage/framework/sessions
              mkdir -p storage/framework/views
              mkdir -p storage/app/public/attendances
              mkdir -p storage/logs
              mkdir -p bootstrap/cache

              echo "8. Mengatur permission Laravel"

              chmod -R ug+rwX storage bootstrap/cache

              echo "9. Membersihkan cache lama"

              php artisan optimize:clear
              php artisan storage:link || true

              echo "10. Menjalankan migration"

              php artisan migrate --force

              echo "11. Membuat cache production"

              php artisan config:cache
              php artisan route:cache
              php artisan view:cache

              echo "12. Menghidupkan aplikasi"

              php artisan up || true

              echo "13. Membersihkan file deployment"

              rm -rf "$TEMP_DIR"
              rm -f "$ARCHIVE"

              echo "Deployment Laravel berhasil."
          EOF
