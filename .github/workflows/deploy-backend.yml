name: Deploy Laravel Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-laravel-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install production dependencies
        run: |
          set -euo pipefail

          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Create deployment archive
        run: |
          set -euo pipefail

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='node_modules' \
            --exclude='tests' \
            -czf "$RUNNER_TEMP/backend.tar.gz" .

          test -s "$RUNNER_TEMP/backend.tar.gz"
          ls -lh "$RUNNER_TEMP/backend.tar.gz"

      - name: Prepare and test SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          : "${SSH_PRIVATE_KEY:?VPS_SSH_KEY kosong}"
          : "${VPS_HOST:?VPS_HOST kosong}"
          : "${VPS_USER:?VPS_USER kosong}"
          : "${VPS_PORT:?VPS_PORT kosong}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          # Memastikan private key valid.
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan \
            -T 15 \
            -p "$VPS_PORT" \
            -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "echo 'Koneksi SSH berhasil.'"

      - name: Upload deployment archive
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/deploy_key \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/backend.tar.gz" \
            "$VPS_USER@$VPS_HOST:/home/deploy/releases/backend/backend.tar.gz"

      - name: Activate atomic deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE_ID: ${{ github.run_number }}-${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s" << 'EOF'
              set -euo pipefail

              BASE_DIR="/var/www/calon-mantoe.cloud/backend"
              RELEASES_DIR="$BASE_DIR/releases"
              SHARED_DIR="$BASE_DIR/shared"
              SHARED_STORAGE="$SHARED_DIR/storage"
              CURRENT_LINK="$BASE_DIR/current"

              ARCHIVE="/home/deploy/releases/backend/backend.tar.gz"

              RELEASE_SHORT="$(printf '%s' "$RELEASE_ID" | cut -c1-24)"
              RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHORT"

              PREVIOUS_RELEASE=""
              SWITCH_COMPLETED=false

              if [ -L "$CURRENT_LINK" ]; then
                PREVIOUS_RELEASE="$(readlink -f "$CURRENT_LINK")"
              fi

              rollback_deployment() {
                EXIT_CODE=$?

                if [ "$EXIT_CODE" -ne 0 ]; then
                  echo "Deployment gagal dengan exit code $EXIT_CODE."

                  if [ "$SWITCH_COMPLETED" = true ] \
                    && [ -n "$PREVIOUS_RELEASE" ] \
                    && [ -d "$PREVIOUS_RELEASE" ]; then

                    echo "Mengembalikan current ke release sebelumnya..."

                    ROLLBACK_LINK="$BASE_DIR/current-rollback"

                    rm -f "$ROLLBACK_LINK"
                    ln -s "$PREVIOUS_RELEASE" "$ROLLBACK_LINK"
                    mv -Tf "$ROLLBACK_LINK" "$CURRENT_LINK"

                    sudo -n systemctl reload php8.3-fpm || true

                    echo "Rollback berhasil:"
                    echo "$PREVIOUS_RELEASE"
                  fi

                  # Jangan menghapus release jika ternyata masih menjadi current.
                  if [ "$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)" \
                    != "$RELEASE_DIR" ]; then
                    rm -rf "$RELEASE_DIR"
                  fi
                fi

                exit "$EXIT_CODE"
              }

              trap rollback_deployment EXIT

              echo "1. Memeriksa archive deployment"
              test -s "$ARCHIVE"

              echo "2. Memeriksa shared .env"
              test -f "$SHARED_DIR/.env"

              echo "3. Menyiapkan shared storage"

              mkdir -p "$SHARED_STORAGE/app/public"
              mkdir -p "$SHARED_STORAGE/app/public/attendances"
              mkdir -p "$SHARED_STORAGE/framework/cache/data"
              mkdir -p "$SHARED_STORAGE/framework/sessions"
              mkdir -p "$SHARED_STORAGE/framework/testing"
              mkdir -p "$SHARED_STORAGE/framework/views"
              mkdir -p "$SHARED_STORAGE/logs"

              test -w "$SHARED_STORAGE" || {
                echo "ERROR: Shared storage tidak writable oleh user deploy."
                exit 1
              }

              echo "4. Membuat folder release baru"

              mkdir -p "$RELEASES_DIR"
              rm -rf "$RELEASE_DIR"
              mkdir -p "$RELEASE_DIR"

              echo "5. Mengekstrak source code"

              tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

              cd "$RELEASE_DIR"

              test -f artisan
              test -f composer.json
              test -d vendor
              test -f public/index.php

              echo "6. Menghubungkan .env"

              rm -f .env
              ln -s "$SHARED_DIR/.env" .env

              echo "7. Menghubungkan shared storage"

              rm -rf storage
              ln -s "$SHARED_STORAGE" storage

              echo "8. Menyiapkan bootstrap/cache"

              mkdir -p bootstrap/cache
              chgrp www-data bootstrap/cache
              chmod 2775 bootstrap/cache

              echo "9. Membuat public storage link"

              rm -rf public/storage

              # Langsung mengarah ke shared upload agar tidak bergantung
              # pada path release tertentu.
              ln -s "$SHARED_STORAGE/app/public" public/storage

              echo "10. Membersihkan cache release baru"

              php artisan optimize:clear

              echo "11. Memeriksa konfigurasi Laravel"

              php artisan about

              echo "12. Menjalankan migration"

              php artisan migrate --force

              echo "13. Membuat cache production"

              php artisan config:cache

              # route:cache dapat gagal jika ada route closure.
              php artisan route:cache

              php artisan view:cache

              echo "14. Memastikan cache berhasil dibuat"

              test -f bootstrap/cache/config.php
              php artisan about > /dev/null

              echo "15. Mengaktifkan release baru secara atomik"

              NEXT_LINK="$BASE_DIR/current-next"

              rm -f "$NEXT_LINK"
              ln -s "$RELEASE_DIR" "$NEXT_LINK"
              mv -Tf "$NEXT_LINK" "$CURRENT_LINK"

              SWITCH_COMPLETED=true

              echo "16. Reload PHP-FPM"

              sudo -n systemctl reload php8.3-fpm

              echo "17. Restart queue worker"

              cd "$CURRENT_LINK"
              php artisan queue:restart || true

              echo "18. Menjalankan health check"

              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 20 \
                --retry 3 \
                --retry-delay 2 \
                --resolve api.calon-mantoe.cloud:443:127.0.0.1 \
                https://api.calon-mantoe.cloud/api/health \
                > /dev/null

              echo "Health check berhasil."

              trap - EXIT

              echo "19. Menghapus archive"

              rm -f "$ARCHIVE"

              echo "20. Menyimpan maksimal 5 release terakhir"

              CURRENT_RELEASE="$(readlink -f "$CURRENT_LINK")"

              mapfile -t OLD_RELEASES < <(
                find "$RELEASES_DIR" \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d \
                  -printf '%T@ %p\n' \
                  | sort -nr \
                  | tail -n +6 \
                  | cut -d' ' -f2-
              )

              for OLD_RELEASE in "${OLD_RELEASES[@]}"; do
                if [ "$OLD_RELEASE" != "$CURRENT_RELEASE" ]; then
                  rm -rf "$OLD_RELEASE"
                fi
              done

              echo "Deployment Laravel berhasil."
              echo "Current release: $CURRENT_RELEASE"
          EOF